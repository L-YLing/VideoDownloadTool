appId: top.apart207.vd-downloader
productName: VD视频下载器
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # ---- 隐私与整洁：以下内容绝不打进安装包 ----
  # 内部规划/规格文档（含本机绝对路径、开发备注）
  - '!.trae/**'
  - '!**/.trae/**'
  # 仓库内的 Markdown / 说明文档
  - '!*.md'
  - '!**/*.md'
  # 开发脚本与图标生成工具
  - '!scripts/**'
  # 构建中间产物 / 打包调试文件（含本机绝对路径）
  - '!*.blockmap'
  - '!builder-debug.yml'
  - '!builder-effective-config.yaml'
  # 授权/试用模块的旧残留（历史上被模板带进来过）
  - '!**/license-module.js'
  - '!out/main.js'
  - '!out/preload.js'
  - '!out/window-icon.ico'
  - '!**/.lic_*'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
win:
  executableName: VD视频下载器
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VD视频下载器
  artifactName: ${productName}-${version}-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
npmRebuild: false
